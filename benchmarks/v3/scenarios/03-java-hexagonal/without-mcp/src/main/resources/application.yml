spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Payment Gateway Configuration
payment:
  gateway:
    stripe:
      api-key: sk_test_mock_key
      timeout: 30000

# Notification Service Configuration
notification:
  service:
    enabled: true
    email:
      from: payments@example.com

logging:
  level:
    com.example.payment: DEBUG
    org.hibernate.SQL: DEBUG
