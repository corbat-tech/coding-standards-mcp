spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

payment:
  gateway:
    stripe:
      api-key: sk_test_mock_test
      timeout: 5000

notification:
  service:
    enabled: false
    email:
      from: test@example.com

logging:
  level:
    com.example.payment: WARN
    org.hibernate.SQL: WARN
