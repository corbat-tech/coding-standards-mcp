# ============================================================================
# CORBAT MCP - Angular Profile
# ============================================================================
# Production-ready standards for Angular applications (v19+).
# Covers standalone components, signals, zoneless, new control flow, and modern patterns.
# Updated for Angular 19/20/21 best practices (2025-2026).
# ============================================================================

name: "Angular Standards"
description: "Production-ready standards for Angular 19+ applications with TypeScript, focusing on standalone components, signals, zoneless change detection, and modern Angular patterns"

# ----------------------------------------------------------------------------
# ARCHITECTURE
# ----------------------------------------------------------------------------
architecture:
  type: "feature-based"
  enforceLayerDependencies: true
  layers:
    - name: features
      description: "Feature modules with standalone components, each feature is self-contained"
      allowedDependencies:
        - shared
        - core
      packages:
        - "src/app/features/*"

    - name: shared
      description: "Reusable standalone components, directives, pipes used across features"
      allowedDependencies:
        - core
      packages:
        - "src/app/shared"
        - "src/app/shared/components"
        - "src/app/shared/directives"
        - "src/app/shared/pipes"

    - name: core
      description: "Singleton services, guards, interceptors, models - provided in root"
      allowedDependencies: []
      packages:
        - "src/app/core"
        - "src/app/core/services"
        - "src/app/core/guards"
        - "src/app/core/interceptors"
        - "src/app/core/models"

# ----------------------------------------------------------------------------
# CODE QUALITY
# ----------------------------------------------------------------------------
codeQuality:
  maxMethodLines: 25
  maxClassLines: 300
  maxFileLines: 400
  maxMethodParameters: 4
  maxCyclomaticComplexity: 10
  requireDocumentation: true
  requireTests: true
  minimumTestCoverage: 70

  principles:
    - "Single Responsibility - one component, one purpose"
    - "Smart/Dumb components pattern (container/presentational)"
    - "Prefer standalone components over NgModules"
    - "Use signals for reactive state"
    - "Prefer new control flow (@if, @for, @switch)"
    - "OnPush change detection by default"
    - "Inject function over constructor injection"

# ----------------------------------------------------------------------------
# NAMING CONVENTIONS
# ----------------------------------------------------------------------------
naming:
  general:
    component: "PascalCase + .component.ts suffix"
    service: "PascalCase + .service.ts suffix"
    directive: "camelCase selector + .directive.ts suffix"
    pipe: "camelCase name + .pipe.ts suffix"
    guard: "camelCase + .guard.ts suffix"
    interceptor: "camelCase + .interceptor.ts suffix"
    model: "PascalCase + .model.ts suffix"
    interface: "PascalCase (no I prefix)"
    enum: "PascalCase"
    constant: "SCREAMING_SNAKE_CASE"

  selectors:
    component: "app-feature-name (kebab-case with app prefix)"
    directive: "appDirectiveName (camelCase with app prefix)"

  files:
    component: "feature-name.component.ts"
    template: "feature-name.component.html"
    styles: "feature-name.component.scss"
    spec: "feature-name.component.spec.ts"
    service: "feature-name.service.ts"
    module: "feature-name.module.ts (legacy only)"

  folders:
    feature: "kebab-case"
    shared: "kebab-case"

# ----------------------------------------------------------------------------
# ANGULAR 19+ MODERN PATTERNS
# ----------------------------------------------------------------------------
modernPatterns:
  standaloneComponents:
    required: true
    description: "All new components must be standalone"
    example: |
      @Component({
        selector: 'app-user-card',
        standalone: true,
        imports: [RouterLink],
        template: `...`
      })

  signals:
    required: true
    description: "Use signals for component state (all stable in v20+)"
    patterns:
      - "signal() for writable state"
      - "computed() for derived state"
      - "linkedSignal() for derived state that can be overwritten"
      - "effect() for side effects (sparingly)"
      - "input() for component inputs (signal-based)"
      - "output() for component outputs"
      - "model() for two-way binding"
      - "viewChild() / viewChildren() for queries (signal-based)"
      - "contentChild() / contentChildren() for content queries"
    example: |
      // Component state
      count = signal(0);
      doubleCount = computed(() => this.count() * 2);

      // Linked signal (can be reset/overwritten)
      selectedId = linkedSignal(() => this.items()[0]?.id);

      // Signal-based inputs/outputs
      name = input.required<string>();
      clicked = output<void>();

      // Signal-based queries
      inputRef = viewChild<ElementRef>('inputElement');

  zoneless:
    recommended: true
    description: "Zoneless change detection (stable in v20.2+)"
    benefits:
      - "60% improvement in startup time"
      - "Better Core Web Vitals"
      - "Smaller bundle size (no zone.js)"
      - "Cleaner stack traces"
      - "No patching for new browser APIs"
    setup: |
      // app.config.ts
      export const appConfig: ApplicationConfig = {
        providers: [
          provideExperimentalZonelessChangeDetection()
        ]
      };
    rules:
      - "Remove zone.js from angular.json build and test"
      - "Use signals or call markForCheck() to trigger CD"
      - "Avoid NgZone.onMicrotaskEmpty, onUnstable, onStable"
      - "AsyncPipe works automatically"
      - "OnPush not required but recommended"

  controlFlow:
    required: true
    description: "Use new built-in control flow"
    patterns:
      - "@if / @else instead of *ngIf"
      - "@for with track instead of *ngFor"
      - "@switch / @case instead of ngSwitch"
      - "@defer for lazy loading"
    example: |
      @if (user()) {
        <app-user-card [user]="user()" />
      } @else {
        <app-loading />
      }

      @for (item of items(); track item.id) {
        <app-item [data]="item" />
      } @empty {
        <p>No items found</p>
      }

  deferredLoading:
    description: "Use @defer for performance optimization"
    triggers:
      - "@defer (on viewport) - lazy load when visible"
      - "@defer (on interaction) - lazy load on click/focus"
      - "@defer (on idle) - lazy load when browser idle"
      - "@defer (when condition) - lazy load when condition true"

  inject:
    required: true
    description: "Prefer inject() function over constructor injection"
    example: |
      // Preferred
      private userService = inject(UserService);
      private router = inject(Router);

      // Avoid (legacy)
      constructor(private userService: UserService) {}

# ----------------------------------------------------------------------------
# STATE MANAGEMENT
# ----------------------------------------------------------------------------
stateManagement:
  local:
    tool: "Signals"
    useWhen:
      - "Component-specific state"
      - "Form state"
      - "UI state (modals, toggles)"
    example: |
      isOpen = signal(false);
      toggle() { this.isOpen.update(v => !v); }

  shared:
    tool: "NgRx SignalStore or Services with Signals"
    useWhen:
      - "State shared across multiple components"
      - "Complex state logic"
      - "State that persists across routes"
    patterns:
      - "SignalStore for feature state"
      - "Service + signals for simple shared state"
      - "Avoid BehaviorSubject for new code"

  server:
    tool: "TanStack Query (Angular Query) or HttpClient + Signals"
    useWhen:
      - "API data fetching"
      - "Caching server state"
      - "Optimistic updates"

  rules:
    - "Signals over RxJS for synchronous state"
    - "RxJS for async streams (HTTP, WebSocket, events)"
    - "toSignal() to convert Observable to Signal"
    - "toObservable() when you need RxJS operators"

# ----------------------------------------------------------------------------
# RXJS GUIDELINES
# ----------------------------------------------------------------------------
rxjs:
  usage: "Async operations only"
  patterns:
    - "Use async pipe in templates (auto-unsubscribe)"
    - "Convert to signals with toSignal() when possible"
    - "takeUntilDestroyed() for manual subscriptions"
    - "Avoid nested subscribes"

  operators:
    preferred:
      - "switchMap for cancellable requests"
      - "concatMap for sequential operations"
      - "mergeMap for parallel operations"
      - "exhaustMap for ignoring while processing"
      - "debounceTime for user input"
      - "distinctUntilChanged to prevent duplicates"
      - "catchError for error handling"
    avoid:
      - "subscribe() in components when async pipe works"
      - "Nested subscribes (use higher-order operators)"
      - "Manual unsubscribe (use takeUntilDestroyed)"

# ----------------------------------------------------------------------------
# TYPESCRIPT
# ----------------------------------------------------------------------------
technologies:
  - name: typescript
    version: "5.x"
    specificRules:
      strict: true
      noImplicitAny: true
      strictNullChecks: true
      noUnusedLocals: true
      noUnusedParameters: true
      exactOptionalPropertyTypes: true

  - name: angular
    version: "19+"
    specificRules:
      standalone: true
      signals: true
      newControlFlow: true
      onPushDefault: true
      zoneless: "recommended (stable in v20.2+)"
      signalForms: "experimental (v21+)"

  - name: linting
    tools:
      - "ESLint"
      - "@angular-eslint"
      - "Prettier"

# ----------------------------------------------------------------------------
# TESTING
# ----------------------------------------------------------------------------
testing:
  framework: "Jest or Vitest"
  assertionLibrary: "Jest/Vitest matchers"
  componentTesting: "Angular Testing Library"

  types:
    unit:
      suffix: ".spec.ts"
      location: "co-located with source"
      coverage: 70

    component:
      suffix: ".spec.ts"
      location: "co-located"
      tool: "Angular Testing Library"
      patterns:
        - "Test user interactions, not implementation"
        - "Use screen queries (getByRole, getByText)"
        - "Avoid testing internal component state"

    integration:
      suffix: ".integration.spec.ts"
      location: "tests/integration"

    e2e:
      tool: "Playwright or Cypress"
      location: "e2e/"

  patterns:
    arrange_act_assert: true
    behavior_testing: true
    mock_services: true
    testing_library_queries: true

  rules:
    - "Prefer Angular Testing Library over TestBed directly"
    - "Test user-visible behavior"
    - "Avoid implementation details (internal state, private methods)"
    - "Use jest-preset-angular or analog for Vitest"

# ----------------------------------------------------------------------------
# STYLING
# ----------------------------------------------------------------------------
styling:
  approach: "Component-scoped SCSS or Tailwind CSS"
  tools:
    - "SCSS (default)"
    - "Tailwind CSS"
    - "CSS Variables for theming"

  rules:
    - "Use ViewEncapsulation.Emulated (default)"
    - "Avoid ViewEncapsulation.None"
    - ":host for component root styles"
    - "CSS custom properties for theming"
    - "Mobile-first responsive design"
    - "BEM naming for complex components (optional with Tailwind)"

# ----------------------------------------------------------------------------
# PERFORMANCE
# ----------------------------------------------------------------------------
performance:
  changeDetection:
    - "OnPush by default for all components"
    - "Use signals to minimize change detection"
    - "Avoid function calls in templates"
    - "Use pure pipes for transformations"

  lazyLoading:
    - "Lazy load routes with loadComponent/loadChildren"
    - "Use @defer for below-fold content"
    - "Preload strategies for critical routes"

  bundling:
    - "Use esbuild (default in Angular 17+)"
    - "Analyze bundle with source-map-explorer"
    - "Tree-shake unused code"

  rules:
    - "trackBy function for @for loops (now 'track' expression)"
    - "Lazy load images with loading='lazy'"
    - "Use OnPush + signals for optimal performance"
    - "Avoid unnecessary template re-evaluations"

# ----------------------------------------------------------------------------
# ROUTING
# ----------------------------------------------------------------------------
routing:
  patterns:
    - "Functional guards (canActivate, canMatch)"
    - "Functional resolvers"
    - "Lazy loading with loadComponent"
    - "Route-level providers"

  example: |
    export const routes: Routes = [
      {
        path: 'users',
        loadComponent: () => import('./users/users.component'),
        canActivate: [authGuard],
        providers: [UserService]
      }
    ];

# ----------------------------------------------------------------------------
# HTTP & API
# ----------------------------------------------------------------------------
api:
  client: "HttpClient with interceptors"
  patterns:
    - "Centralize API configuration"
    - "Use functional interceptors"
    - "Type all responses"
    - "Handle errors globally"

  interceptors:
    - "Auth token injection"
    - "Error handling"
    - "Loading state"
    - "Retry logic"

  example: |
    export const authInterceptor: HttpInterceptorFn = (req, next) => {
      const token = inject(AuthService).token();
      if (token) {
        req = req.clone({
          setHeaders: { Authorization: `Bearer ${token}` }
        });
      }
      return next(req);
    };

# ----------------------------------------------------------------------------
# FORMS
# ----------------------------------------------------------------------------
forms:
  preferred: "Reactive Forms"
  patterns:
    - "FormBuilder for complex forms"
    - "Typed forms (FormGroup<T>)"
    - "Custom validators as functions"
    - "Async validators for server validation"

  rules:
    - "Prefer Reactive Forms over Template-driven"
    - "Use FormControl signals (.value signal in Angular 18+)"
    - "Centralize validation messages"
    - "Handle form state (pristine, touched, valid)"

# ----------------------------------------------------------------------------
# PROJECT STRUCTURE
# ----------------------------------------------------------------------------
# Recommended folder structure:
#
# src/app/
# ├── core/                      # Singleton services, guards, interceptors
# │   ├── services/
# │   │   ├── auth.service.ts
# │   │   └── api.service.ts
# │   ├── guards/
# │   │   └── auth.guard.ts
# │   ├── interceptors/
# │   │   └── auth.interceptor.ts
# │   └── models/
# │       └── user.model.ts
# │
# ├── shared/                    # Reusable standalone components
# │   ├── components/
# │   │   ├── button/
# │   │   │   ├── button.component.ts
# │   │   │   └── button.component.spec.ts
# │   │   └── modal/
# │   ├── directives/
# │   ├── pipes/
# │   └── utils/
# │
# ├── features/                  # Feature modules (standalone)
# │   ├── auth/
# │   │   ├── login/
# │   │   │   ├── login.component.ts
# │   │   │   └── login.component.spec.ts
# │   │   ├── register/
# │   │   └── auth.routes.ts
# │   ├── dashboard/
# │   └── settings/
# │
# ├── app.component.ts           # Root standalone component
# ├── app.config.ts              # Application configuration
# └── app.routes.ts              # Root routes
#
# e2e/                           # End-to-end tests
# └── specs/

# ----------------------------------------------------------------------------
# CODE EXAMPLES
# ----------------------------------------------------------------------------
codeExamples:
  standaloneComponent:
    description: "Modern standalone component with signals"
    code: |
      // features/users/user-card.component.ts
      import { Component, input, output, computed } from '@angular/core';
      import { RouterLink } from '@angular/router';
      import type { User } from '@/core/models/user.model';

      @Component({
        selector: 'app-user-card',
        standalone: true,
        imports: [RouterLink],
        template: `
          @if (user(); as u) {
            <article class="user-card" [class.active]="isActive()">
              <img [src]="u.avatar" [alt]="fullName() + '\\'s avatar'" />
              <h3>{{ fullName() }}</h3>
              <p>{{ u.email }}</p>
              <button (click)="handleSelect()">Select</button>
              <a [routerLink]="['/users', u.id]">View Profile</a>
            </article>
          }
        `,
        styles: [`
          .user-card { @apply p-4 rounded-lg shadow; }
          .user-card.active { @apply ring-2 ring-primary; }
        `]
      })
      export class UserCardComponent {
        // Signal-based inputs
        user = input.required<User>();
        isActive = input(false);

        // Signal-based output
        selected = output<string>();

        // Computed signal
        fullName = computed(() => {
          const u = this.user();
          return `${u.firstName} ${u.lastName}`;
        });

        handleSelect() {
          this.selected.emit(this.user().id);
        }
      }

  signalState:
    description: "Component state with signals"
    code: |
      // features/counter/counter.component.ts
      import { Component, signal, computed, effect } from '@angular/core';

      @Component({
        selector: 'app-counter',
        standalone: true,
        template: `
          <div class="counter">
            <p>Count: {{ count() }}</p>
            <p>Double: {{ doubleCount() }}</p>
            <button (click)="increment()">+</button>
            <button (click)="decrement()">-</button>
            <button (click)="reset()">Reset</button>
          </div>
        `
      })
      export class CounterComponent {
        // Writable signal
        count = signal(0);

        // Computed signal (derived state)
        doubleCount = computed(() => this.count() * 2);

        constructor() {
          // Effect for side effects (logging, localStorage, etc.)
          effect(() => {
            console.log(`Count changed to: ${this.count()}`);
          });
        }

        increment() {
          this.count.update(c => c + 1);
        }

        decrement() {
          this.count.update(c => c - 1);
        }

        reset() {
          this.count.set(0);
        }
      }

  service:
    description: "Injectable service with signals and HttpClient"
    code: |
      // core/services/user.service.ts
      import { Injectable, inject, signal, computed } from '@angular/core';
      import { HttpClient } from '@angular/common/http';
      import { toSignal } from '@angular/core/rxjs-interop';
      import type { User } from '@/core/models/user.model';

      @Injectable({ providedIn: 'root' })
      export class UserService {
        private http = inject(HttpClient);

        private usersSignal = signal<User[]>([]);
        private loadingSignal = signal(false);
        private errorSignal = signal<Error | null>(null);

        // Public readonly signals
        readonly users = this.usersSignal.asReadonly();
        readonly isLoading = this.loadingSignal.asReadonly();
        readonly error = this.errorSignal.asReadonly();

        // Computed
        readonly userCount = computed(() => this.usersSignal().length);

        async loadUsers(): Promise<void> {
          this.loadingSignal.set(true);
          this.errorSignal.set(null);

          try {
            const users = await firstValueFrom(
              this.http.get<User[]>('/api/users')
            );
            this.usersSignal.set(users);
          } catch (error) {
            this.errorSignal.set(error as Error);
          } finally {
            this.loadingSignal.set(false);
          }
        }

        getUserById(id: string): User | undefined {
          return this.usersSignal().find(u => u.id === id);
        }
      }

  functionalGuard:
    description: "Functional route guard"
    code: |
      // core/guards/auth.guard.ts
      import { inject } from '@angular/core';
      import { Router, type CanActivateFn } from '@angular/router';
      import { AuthService } from '@/core/services/auth.service';

      export const authGuard: CanActivateFn = (route, state) => {
        const authService = inject(AuthService);
        const router = inject(Router);

        if (authService.isAuthenticated()) {
          return true;
        }

        // Redirect to login with return URL
        return router.createUrlTree(['/login'], {
          queryParams: { returnUrl: state.url }
        });
      };

      // Usage in routes
      export const routes: Routes = [
        {
          path: 'dashboard',
          loadComponent: () => import('./dashboard/dashboard.component'),
          canActivate: [authGuard]
        }
      ];

  functionalInterceptor:
    description: "Functional HTTP interceptor"
    code: |
      // core/interceptors/auth.interceptor.ts
      import { inject } from '@angular/core';
      import { HttpInterceptorFn, HttpErrorResponse } from '@angular/common/http';
      import { catchError, throwError } from 'rxjs';
      import { AuthService } from '@/core/services/auth.service';
      import { Router } from '@angular/router';

      export const authInterceptor: HttpInterceptorFn = (req, next) => {
        const authService = inject(AuthService);
        const router = inject(Router);

        const token = authService.token();

        // Add auth header if token exists
        if (token) {
          req = req.clone({
            setHeaders: {
              Authorization: `Bearer ${token}`
            }
          });
        }

        return next(req).pipe(
          catchError((error: HttpErrorResponse) => {
            if (error.status === 401) {
              authService.logout();
              router.navigate(['/login']);
            }
            return throwError(() => error);
          })
        );
      };

      // Register in app.config.ts
      export const appConfig: ApplicationConfig = {
        providers: [
          provideHttpClient(withInterceptors([authInterceptor]))
        ]
      };

  signalStore:
    description: "NgRx SignalStore for feature state"
    code: |
      // features/products/products.store.ts
      import { signalStore, withState, withComputed, withMethods, patchState } from '@ngrx/signals';
      import { inject } from '@angular/core';
      import { ProductService } from './products.service';
      import type { Product } from '@/core/models/product.model';

      interface ProductsState {
        products: Product[];
        selectedId: string | null;
        isLoading: boolean;
        error: string | null;
      }

      const initialState: ProductsState = {
        products: [],
        selectedId: null,
        isLoading: false,
        error: null
      };

      export const ProductsStore = signalStore(
        withState(initialState),

        withComputed((store) => ({
          selectedProduct: computed(() => {
            const id = store.selectedId();
            return store.products().find(p => p.id === id) ?? null;
          }),
          productCount: computed(() => store.products().length)
        })),

        withMethods((store, productService = inject(ProductService)) => ({
          async loadProducts() {
            patchState(store, { isLoading: true, error: null });
            try {
              const products = await productService.getAll();
              patchState(store, { products, isLoading: false });
            } catch (error) {
              patchState(store, { error: (error as Error).message, isLoading: false });
            }
          },

          selectProduct(id: string) {
            patchState(store, { selectedId: id });
          },

          clearSelection() {
            patchState(store, { selectedId: null });
          }
        }))
      );

  componentTest:
    description: "Component test with Angular Testing Library"
    code: |
      // features/users/user-card.component.spec.ts
      import { render, screen } from '@testing-library/angular';
      import userEvent from '@testing-library/user-event';
      import { UserCardComponent } from './user-card.component';

      describe('UserCardComponent', () => {
        const mockUser = {
          id: '1',
          firstName: 'John',
          lastName: 'Doe',
          email: 'john@example.com',
          avatar: '/avatar.png'
        };

        it('displays user information', async () => {
          await render(UserCardComponent, {
            inputs: { user: mockUser }
          });

          expect(screen.getByText('John Doe')).toBeInTheDocument();
          expect(screen.getByText('john@example.com')).toBeInTheDocument();
        });

        it('emits selected event when button clicked', async () => {
          const user = userEvent.setup();
          const selectedSpy = jest.fn();

          await render(UserCardComponent, {
            inputs: { user: mockUser },
            on: { selected: selectedSpy }
          });

          await user.click(screen.getByRole('button', { name: /select/i }));

          expect(selectedSpy).toHaveBeenCalledWith('1');
        });

        it('applies active class when isActive is true', async () => {
          await render(UserCardComponent, {
            inputs: { user: mockUser, isActive: true }
          });

          expect(screen.getByRole('article')).toHaveClass('active');
        });
      });

  deferBlock:
    description: "@defer for lazy loading and performance"
    code: |
      // features/dashboard/dashboard.component.ts
      @Component({
        selector: 'app-dashboard',
        standalone: true,
        imports: [HeavyChartComponent, DataTableComponent],
        template: `
          <main>
            <h1>Dashboard</h1>

            <!-- Load chart when visible in viewport -->
            @defer (on viewport) {
              <app-heavy-chart [data]="chartData()" />
            } @placeholder {
              <div class="chart-placeholder">Loading chart...</div>
            } @loading (minimum 300ms) {
              <app-skeleton type="chart" />
            }

            <!-- Load table when user scrolls down -->
            @defer (on viewport; prefetch on idle) {
              <app-data-table [rows]="tableData()" />
            } @placeholder {
              <p>Scroll to see data table</p>
            }

            <!-- Load on interaction -->
            @defer (on interaction) {
              <app-comments [postId]="postId()" />
            } @placeholder {
              <button>Click to load comments</button>
            }

            <!-- Conditional defer -->
            @defer (when showAdvanced()) {
              <app-advanced-settings />
            }
          </main>
        `
      })
      export class DashboardComponent {
        chartData = signal<ChartData[]>([]);
        tableData = signal<TableRow[]>([]);
        postId = input.required<string>();
        showAdvanced = signal(false);
      }

# ----------------------------------------------------------------------------
# ANTI-PATTERNS
# ----------------------------------------------------------------------------
antiPatterns:
  ngModulesForNewCode:
    name: "Using NgModules for New Components"
    description: "NgModules are legacy; use standalone components"
    bad: |
      // ❌ NgModule-based component
      @NgModule({
        declarations: [UserCardComponent],
        imports: [CommonModule],
        exports: [UserCardComponent]
      })
      export class UserModule {}

      @Component({
        selector: 'app-user-card',
        templateUrl: './user-card.component.html'
      })
      export class UserCardComponent {}
    good: |
      // ✅ Standalone component
      @Component({
        selector: 'app-user-card',
        standalone: true,
        imports: [RouterLink],
        template: `...`
      })
      export class UserCardComponent {}

  constructorInjection:
    name: "Constructor Injection Instead of inject()"
    description: "Use inject() function for cleaner dependency injection"
    bad: |
      // ❌ Constructor injection
      @Component({ ... })
      export class UserListComponent {
        constructor(
          private userService: UserService,
          private router: Router,
          private route: ActivatedRoute
        ) {}
      }
    good: |
      // ✅ inject() function
      @Component({ ... })
      export class UserListComponent {
        private userService = inject(UserService);
        private router = inject(Router);
        private route = inject(ActivatedRoute);
      }

  oldControlFlow:
    name: "Using *ngIf/*ngFor Instead of @if/@for"
    description: "Use new built-in control flow (@if, @for, @switch)"
    bad: |
      // ❌ Old structural directives
      <div *ngIf="user; else loading">{{ user.name }}</div>
      <ng-template #loading>Loading...</ng-template>

      <li *ngFor="let item of items; trackBy: trackById">
        {{ item.name }}
      </li>
    good: |
      // ✅ New control flow
      @if (user(); as u) {
        <div>{{ u.name }}</div>
      } @else {
        <span>Loading...</span>
      }

      @for (item of items(); track item.id) {
        <li>{{ item.name }}</li>
      } @empty {
        <li>No items found</li>
      }

  behaviorSubjectOverSignals:
    name: "Using BehaviorSubject When Signals Are Better"
    description: "For synchronous state, prefer signals over RxJS"
    bad: |
      // ❌ BehaviorSubject for simple state
      @Injectable({ providedIn: 'root' })
      export class CounterService {
        private count$ = new BehaviorSubject(0);
        readonly count = this.count$.asObservable();

        increment() {
          this.count$.next(this.count$.value + 1);
        }
      }
    good: |
      // ✅ Signals for synchronous state
      @Injectable({ providedIn: 'root' })
      export class CounterService {
        private _count = signal(0);
        readonly count = this._count.asReadonly();

        increment() {
          this._count.update(c => c + 1);
        }
      }

  subscribeWithoutCleanup:
    name: "Manual Subscribe Without Cleanup"
    description: "Use takeUntilDestroyed() or async pipe instead"
    bad: |
      // ❌ Manual subscribe leaks memory
      @Component({ ... })
      export class UserComponent implements OnInit {
        user: User | null = null;

        ngOnInit() {
          this.userService.getUser().subscribe(user => {
            this.user = user;
          });
        }
      }
    good: |
      // ✅ Use toSignal() or takeUntilDestroyed()
      @Component({ ... })
      export class UserComponent {
        private userService = inject(UserService);

        // Option 1: toSignal (preferred)
        user = toSignal(this.userService.getUser());

        // Option 2: takeUntilDestroyed
        private destroyRef = inject(DestroyRef);

        ngOnInit() {
          this.userService.getUser().pipe(
            takeUntilDestroyed(this.destroyRef)
          ).subscribe(user => {
            this.userSignal.set(user);
          });
        }
      }

  defaultChangeDetection:
    name: "Using Default Change Detection"
    description: "OnPush with signals is more performant"
    bad: |
      // ❌ Default change detection
      @Component({
        selector: 'app-user-list',
        template: `...`
        // No changeDetection specified = Default
      })
      export class UserListComponent {
        users: User[] = [];
      }
    good: |
      // ✅ OnPush with signals
      @Component({
        selector: 'app-user-list',
        changeDetection: ChangeDetectionStrategy.OnPush,
        template: `
          @for (user of users(); track user.id) {
            <app-user-card [user]="user" />
          }
        `
      })
      export class UserListComponent {
        users = signal<User[]>([]);
      }

  classBasedGuards:
    name: "Class-Based Guards and Resolvers"
    description: "Use functional guards and resolvers instead"
    bad: |
      // ❌ Class-based guard
      @Injectable({ providedIn: 'root' })
      export class AuthGuard implements CanActivate {
        constructor(private auth: AuthService, private router: Router) {}

        canActivate(): boolean {
          if (this.auth.isAuthenticated()) return true;
          this.router.navigate(['/login']);
          return false;
        }
      }
    good: |
      // ✅ Functional guard
      export const authGuard: CanActivateFn = () => {
        const auth = inject(AuthService);
        const router = inject(Router);

        return auth.isAuthenticated()
          ? true
          : router.createUrlTree(['/login']);
      };

  templateFunctionCalls:
    name: "Function Calls in Templates"
    description: "Use computed signals instead of functions in templates"
    bad: |
      // ❌ Function called on every change detection
      <p>{{ getFullName() }}</p>
      <p>{{ calculateTotal(items) }}</p>
    good: |
      // ✅ Use computed signals
      fullName = computed(() => `${this.user().firstName} ${this.user().lastName}`);
      total = computed(() => this.items().reduce((sum, i) => sum + i.price, 0));

      // Template
      <p>{{ fullName() }}</p>
      <p>{{ total() }}</p>

  nestedSubscribes:
    name: "Nested Subscribes"
    description: "Use higher-order mapping operators instead"
    bad: |
      // ❌ Nested subscribes
      this.route.params.subscribe(params => {
        this.userService.getUser(params['id']).subscribe(user => {
          this.user = user;
        });
      });
    good: |
      // ✅ Use switchMap
      user = toSignal(
        this.route.params.pipe(
          switchMap(params => this.userService.getUser(params['id']))
        )
      );

  hardcodedStringsInTemplates:
    name: "Hardcoded Strings in Templates"
    description: "Use i18n or constants for user-facing strings"
    bad: |
      // ❌ Hardcoded strings
      <button>Submit</button>
      <p>No users found</p>
      <h1>User Management</h1>
    good: |
      // ✅ Use i18n
      <button i18n>Submit</button>
      <p i18n>No users found</p>

      // ✅ Or constants file
      <button>{{ LABELS.submit }}</button>
