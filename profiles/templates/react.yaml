# ============================================================================
# CORBAT MCP - React Profile
# ============================================================================
# Production-ready standards for React applications with TypeScript.
# ============================================================================

name: "React Standards"
description: "Production-ready standards for React applications with TypeScript, focusing on hooks, component architecture, state management, and accessibility"

# ----------------------------------------------------------------------------
# ARCHITECTURE
# ----------------------------------------------------------------------------
architecture:
  type: "feature-based"
  enforceLayerDependencies: true
  layers:
    - name: features
      description: "Feature modules containing components, hooks, and logic for specific features"
      allowedDependencies:
        - shared
        - core
      packages:
        - "src/features/*"

    - name: shared
      description: "Reusable UI components, hooks, and utilities used across features"
      allowedDependencies:
        - core
      packages:
        - "src/shared"
        - "src/shared/components"
        - "src/shared/hooks"
        - "src/shared/utils"

    - name: core
      description: "Application core: routing, state management setup, API client, types"
      allowedDependencies: []
      packages:
        - "src/core"
        - "src/core/api"
        - "src/core/store"
        - "src/core/types"

# ----------------------------------------------------------------------------
# CODE QUALITY
# ----------------------------------------------------------------------------
codeQuality:
  maxMethodLines: 30
  maxClassLines: 200
  maxFileLines: 300
  maxMethodParameters: 4
  maxCyclomaticComplexity: 10
  requireDocumentation: true
  requireTests: true
  minimumTestCoverage: 70

  principles:
    - "Component Single Responsibility"
    - "Composition over inheritance"
    - "Colocation (keep related code together)"
    - "Minimal prop drilling"
    - "Accessibility first"

# ----------------------------------------------------------------------------
# NAMING CONVENTIONS
# ----------------------------------------------------------------------------
naming:
  general:
    component: PascalCase
    hook: '"use" prefix + camelCase'
    util: camelCase
    constant: SCREAMING_SNAKE_CASE
    type: PascalCase
    interface: PascalCase
    enum: PascalCase
    file: PascalCase for components, camelCase for utils
    folder: kebab-case

  suffixes:
    page: "Page"
    layout: "Layout"
    context: "Context"
    provider: "Provider"
    hook: "" # useXxx pattern
    store: "Store"
    slice: "Slice"
    service: "Service"
    type: "" # No suffix for types

  testing:
    testFile: ".test.tsx"
    testComponent: ".test.tsx"
    testHook: ".test.ts"
    storybook: ".stories.tsx"

# ----------------------------------------------------------------------------
# COMPONENT GUIDELINES
# ----------------------------------------------------------------------------
components:
  structure:
    - "Props interface at top"
    - "Component function"
    - "Hooks at the beginning"
    - "Event handlers"
    - "Render helpers (if needed)"
    - "Return JSX"

  rules:
    - "One component per file"
    - "Export component as default"
    - "Export types as named exports"
    - "Use functional components only"
    - "Destructure props"
    - "Use explicit return for complex JSX"
    - "Keep components under 200 lines"

  propsNaming:
    eventHandlers: "onAction (onClick, onSubmit)"
    booleans: "is/has/should prefix (isOpen, hasError)"
    children: "children for nested content"
    className: "className for styling"

# ----------------------------------------------------------------------------
# STATE MANAGEMENT
# ----------------------------------------------------------------------------
stateManagement:
  local:
    tool: "useState / useReducer"
    useWhen:
      - "Component-specific state"
      - "Form state"
      - "UI state (modals, dropdowns)"

  shared:
    tool: "Zustand or Redux Toolkit"
    useWhen:
      - "State shared across multiple components"
      - "Complex state logic"
      - "State that persists across routes"

  server:
    tool: "TanStack Query (React Query)"
    useWhen:
      - "API data fetching"
      - "Caching server state"
      - "Optimistic updates"
      - "Background refetching"

  rules:
    - "Prefer server state (React Query) over client state"
    - "Colocate state as close as possible to where it's used"
    - "Avoid prop drilling > 2 levels"
    - "Use context for theme, auth, i18n"

# ----------------------------------------------------------------------------
# TYPESCRIPT
# ----------------------------------------------------------------------------
technologies:
  - name: typescript
    version: "5.x"
    specificRules:
      strict: true
      noImplicitAny: true
      strictNullChecks: true
      noUnusedLocals: true
      preferConst: true
      useUnknownInCatchVariables: true

  - name: react
    version: "18+"
    specificRules:
      useFunctionalComponents: true
      useHooks: true
      useStrictMode: true
      useSuspense: true
      useErrorBoundaries: true

  - name: linting
    tools:
      - "ESLint"
      - "Prettier"
      - "eslint-plugin-react-hooks"
      - "eslint-plugin-jsx-a11y"

# ----------------------------------------------------------------------------
# TESTING
# ----------------------------------------------------------------------------
testing:
  framework: "Vitest"
  assertionLibrary: "Vitest"
  componentTesting: "React Testing Library"

  types:
    unit:
      suffix: ".test.ts"
      location: "**/*.test.ts"
      coverage: 70

    component:
      suffix: ".test.tsx"
      location: "**/*.test.tsx"
      coverage: 70

    integration:
      suffix: ".integration.test.tsx"
      location: "tests/integration"

    e2e:
      tool: "Playwright or Cypress"
      location: "tests/e2e"

  patterns:
    arrange_act_assert: true
    userCentric: true # Test from user perspective

  rules:
    - "Test behavior, not implementation"
    - "Use getByRole, getByLabelText over getByTestId"
    - "Avoid testing internal state"
    - "Mock API calls, not components"
    - "Test accessibility"

# ----------------------------------------------------------------------------
# STYLING
# ----------------------------------------------------------------------------
styling:
  approach: "Utility-first or CSS Modules"
  tools:
    - "Tailwind CSS (recommended)"
    - "CSS Modules"
    - "Styled Components"

  rules:
    - "Mobile-first responsive design"
    - "Use design tokens for consistency"
    - "Avoid inline styles"
    - "Keep specificity low"
    - "Use CSS variables for theming"

# ----------------------------------------------------------------------------
# ACCESSIBILITY
# ----------------------------------------------------------------------------
accessibility:
  level: "WCAG 2.1 AA"
  rules:
    - "All interactive elements must be keyboard accessible"
    - "Use semantic HTML elements"
    - "Provide alt text for images"
    - "Ensure sufficient color contrast"
    - "Use ARIA attributes when needed"
    - "Test with screen readers"
    - "Support reduced motion"

  testing:
    - "eslint-plugin-jsx-a11y"
    - "axe-core"
    - "Manual keyboard navigation testing"

# ----------------------------------------------------------------------------
# PERFORMANCE
# ----------------------------------------------------------------------------
performance:
  rules:
    - "Lazy load routes and heavy components"
    - "Use React.memo for expensive renders"
    - "Use useMemo and useCallback appropriately"
    - "Optimize images (next/image, srcset)"
    - "Minimize bundle size"
    - "Use code splitting"

  metrics:
    - "Largest Contentful Paint (LCP) < 2.5s"
    - "First Input Delay (FID) < 100ms"
    - "Cumulative Layout Shift (CLS) < 0.1"

# ----------------------------------------------------------------------------
# API INTEGRATION
# ----------------------------------------------------------------------------
api:
  client: "TanStack Query + fetch/axios"
  patterns:
    - "Centralize API client configuration"
    - "Use TypeScript for API responses"
    - "Handle loading, error, and success states"
    - "Implement optimistic updates"
    - "Use proper error boundaries"

  errorHandling:
    - "Show user-friendly error messages"
    - "Provide retry mechanisms"
    - "Log errors for debugging"
    - "Graceful degradation"

# ----------------------------------------------------------------------------
# PROJECT STRUCTURE
# ----------------------------------------------------------------------------
# Recommended folder structure:
#
# src/
# ├── app/                    # App entry, routing, providers
# │   ├── routes/
# │   ├── providers/
# │   └── App.tsx
# ├── core/                   # Application core
# │   ├── api/               # API client setup
# │   ├── store/             # Global state
# │   ├── types/             # Shared types
# │   └── config/            # App configuration
# ├── features/              # Feature modules
# │   ├── auth/
# │   │   ├── components/
# │   │   ├── hooks/
# │   │   ├── services/
# │   │   ├── types/
# │   │   └── index.ts
# │   ├── dashboard/
# │   └── settings/
# ├── shared/                # Shared code
# │   ├── components/        # UI components
# │   │   ├── Button/
# │   │   ├── Input/
# │   │   └── Modal/
# │   ├── hooks/             # Custom hooks
# │   ├── utils/             # Utilities
# │   └── types/             # Shared types
# └── index.tsx
#
# tests/
# ├── integration/
# ├── e2e/
# └── setup.ts

# ----------------------------------------------------------------------------
# CODE EXAMPLES
# ----------------------------------------------------------------------------
codeExamples:
  functionalComponent:
    description: "Basic functional component with TypeScript"
    code: |
      // components/UserCard.tsx
      interface UserCardProps {
        user: User;
        onSelect?: (userId: string) => void;
        isActive?: boolean;
      }

      export default function UserCard({ user, onSelect, isActive = false }: UserCardProps) {
        const handleClick = () => onSelect?.(user.id);

        return (
          <article
            className={cn('user-card', { 'user-card--active': isActive })}
            onClick={handleClick}
            role="button"
            tabIndex={0}
            aria-pressed={isActive}
          >
            <img src={user.avatar} alt={`${user.name}'s avatar`} />
            <h3>{user.name}</h3>
            <p>{user.email}</p>
          </article>
        );
      }

  customHook:
    description: "Custom hook with proper typing and cleanup"
    code: |
      // hooks/useDebounce.ts
      import { useState, useEffect } from 'react';

      export function useDebounce<T>(value: T, delay: number): T {
        const [debouncedValue, setDebouncedValue] = useState(value);

        useEffect(() => {
          const timer = setTimeout(() => setDebouncedValue(value), delay);
          return () => clearTimeout(timer); // Cleanup
        }, [value, delay]);

        return debouncedValue;
      }

  dataFetchingHook:
    description: "Data fetching with TanStack Query"
    code: |
      // hooks/useUsers.ts
      import { useQuery, useMutation, useQueryClient } from '@tanstack/react-query';
      import { usersApi } from '@/core/api/users';

      export function useUsers() {
        return useQuery({
          queryKey: ['users'],
          queryFn: usersApi.getAll,
          staleTime: 5 * 60 * 1000, // 5 minutes
        });
      }

      export function useCreateUser() {
        const queryClient = useQueryClient();

        return useMutation({
          mutationFn: usersApi.create,
          onSuccess: () => {
            queryClient.invalidateQueries({ queryKey: ['users'] });
          },
        });
      }

  contextProvider:
    description: "Context with TypeScript for theme/auth"
    code: |
      // context/AuthContext.tsx
      interface AuthContextValue {
        user: User | null;
        isAuthenticated: boolean;
        login: (credentials: Credentials) => Promise<void>;
        logout: () => void;
      }

      const AuthContext = createContext<AuthContextValue | null>(null);

      export function AuthProvider({ children }: { children: React.ReactNode }) {
        const [user, setUser] = useState<User | null>(null);

        const login = async (credentials: Credentials) => {
          const user = await authApi.login(credentials);
          setUser(user);
        };

        const logout = () => setUser(null);

        const value: AuthContextValue = {
          user,
          isAuthenticated: !!user,
          login,
          logout,
        };

        return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
      }

      export function useAuth(): AuthContextValue {
        const context = useContext(AuthContext);
        if (!context) throw new Error('useAuth must be used within AuthProvider');
        return context;
      }

  zustandStore:
    description: "Zustand store for global state"
    code: |
      // stores/cartStore.ts
      import { create } from 'zustand';
      import { devtools, persist } from 'zustand/middleware';

      interface CartState {
        items: CartItem[];
        total: number;
        addItem: (item: CartItem) => void;
        removeItem: (itemId: string) => void;
        clearCart: () => void;
      }

      export const useCartStore = create<CartState>()(
        devtools(
          persist(
            (set, get) => ({
              items: [],
              total: 0,

              addItem: (item) =>
                set((state) => ({
                  items: [...state.items, item],
                  total: state.total + item.price,
                })),

              removeItem: (itemId) =>
                set((state) => {
                  const item = state.items.find((i) => i.id === itemId);
                  return {
                    items: state.items.filter((i) => i.id !== itemId),
                    total: state.total - (item?.price ?? 0),
                  };
                }),

              clearCart: () => set({ items: [], total: 0 }),
            }),
            { name: 'cart-storage' }
          )
        )
      );

  componentTest:
    description: "Component test with React Testing Library"
    code: |
      // components/UserCard.test.tsx
      import { render, screen } from '@testing-library/react';
      import userEvent from '@testing-library/user-event';
      import { UserCard } from './UserCard';

      describe('UserCard', () => {
        const mockUser = { id: '1', name: 'John Doe', email: 'john@example.com', avatar: '/avatar.png' };

        it('renders user information', () => {
          render(<UserCard user={mockUser} />);

          expect(screen.getByRole('heading', { name: 'John Doe' })).toBeInTheDocument();
          expect(screen.getByText('john@example.com')).toBeInTheDocument();
          expect(screen.getByAltText("John Doe's avatar")).toBeInTheDocument();
        });

        it('calls onSelect when clicked', async () => {
          const user = userEvent.setup();
          const onSelect = vi.fn();

          render(<UserCard user={mockUser} onSelect={onSelect} />);
          await user.click(screen.getByRole('button'));

          expect(onSelect).toHaveBeenCalledWith('1');
        });

        it('is keyboard accessible', async () => {
          const user = userEvent.setup();
          const onSelect = vi.fn();

          render(<UserCard user={mockUser} onSelect={onSelect} />);
          await user.tab();
          await user.keyboard('{Enter}');

          expect(onSelect).toHaveBeenCalled();
        });
      });

  errorBoundary:
    description: "Error boundary for graceful error handling"
    code: |
      // components/ErrorBoundary.tsx
      interface Props {
        children: React.ReactNode;
        fallback?: React.ReactNode;
      }

      interface State {
        hasError: boolean;
        error?: Error;
      }

      export class ErrorBoundary extends React.Component<Props, State> {
        state: State = { hasError: false };

        static getDerivedStateFromError(error: Error): State {
          return { hasError: true, error };
        }

        componentDidCatch(error: Error, errorInfo: React.ErrorInfo) {
          console.error('Error caught:', error, errorInfo);
          // Log to error tracking service
        }

        render() {
          if (this.state.hasError) {
            return this.props.fallback ?? (
              <div role="alert">
                <h2>Something went wrong</h2>
                <button onClick={() => this.setState({ hasError: false })}>
                  Try again
                </button>
              </div>
            );
          }
          return this.props.children;
        }
      }

# ----------------------------------------------------------------------------
# ANTI-PATTERNS
# ----------------------------------------------------------------------------
antiPatterns:
  propDrilling:
    name: "Prop Drilling"
    description: "Passing props through many levels of components"
    bad: |
      // ❌ Props passed through 4 levels
      function App() {
        const [user, setUser] = useState<User | null>(null);
        return <Layout user={user} setUser={setUser} />;
      }
      function Layout({ user, setUser }) {
        return <Sidebar user={user} setUser={setUser} />;
      }
      function Sidebar({ user, setUser }) {
        return <UserMenu user={user} setUser={setUser} />;
      }
    good: |
      // ✅ Use Context or Zustand
      function App() {
        return (
          <AuthProvider>
            <Layout />
          </AuthProvider>
        );
      }
      function UserMenu() {
        const { user, logout } = useAuth(); // Direct access
        return <button onClick={logout}>Logout {user?.name}</button>;
      }

  useEffectAbuse:
    name: "useEffect for Derived State"
    description: "Using useEffect to synchronize state that should be computed"
    bad: |
      // ❌ useEffect for derived state
      function ProductList({ products }) {
        const [total, setTotal] = useState(0);

        useEffect(() => {
          const sum = products.reduce((acc, p) => acc + p.price, 0);
          setTotal(sum);
        }, [products]);

        return <div>Total: {total}</div>;
      }
    good: |
      // ✅ Use useMemo for derived values
      function ProductList({ products }) {
        const total = useMemo(
          () => products.reduce((acc, p) => acc + p.price, 0),
          [products]
        );

        return <div>Total: {total}</div>;
      }

  inlineHandlers:
    name: "Inline Function Definitions in JSX"
    description: "Creating new functions on every render"
    bad: |
      // ❌ New function created on every render
      function ItemList({ items, onRemove }) {
        return (
          <ul>
            {items.map(item => (
              <li key={item.id}>
                {item.name}
                <button onClick={() => onRemove(item.id)}>Remove</button>
              </li>
            ))}
          </ul>
        );
      }
    good: |
      // ✅ Use useCallback or extract component
      function ItemList({ items, onRemove }) {
        return (
          <ul>
            {items.map(item => (
              <Item key={item.id} item={item} onRemove={onRemove} />
            ))}
          </ul>
        );
      }

      const Item = memo(function Item({ item, onRemove }) {
        const handleRemove = useCallback(() => onRemove(item.id), [item.id, onRemove]);
        return (
          <li>
            {item.name}
            <button onClick={handleRemove}>Remove</button>
          </li>
        );
      });

  useStateForServerData:
    name: "useState for Server Data"
    description: "Managing server state with useState instead of a data fetching library"
    bad: |
      // ❌ Manual server state management
      function UserList() {
        const [users, setUsers] = useState<User[]>([]);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState<Error | null>(null);

        useEffect(() => {
          setLoading(true);
          fetchUsers()
            .then(setUsers)
            .catch(setError)
            .finally(() => setLoading(false));
        }, []);

        // No caching, no refetch, no deduplication...
      }
    good: |
      // ✅ Use TanStack Query
      function UserList() {
        const { data: users, isLoading, error, refetch } = useQuery({
          queryKey: ['users'],
          queryFn: fetchUsers,
        });

        // Automatic caching, refetch, deduplication, etc.
      }

  anyType:
    name: "Using 'any' Type"
    description: "Disabling TypeScript's type checking with 'any'"
    bad: |
      // ❌ any disables type safety
      function processData(data: any) {
        return data.items.map((item: any) => item.value);
      }
    good: |
      // ✅ Proper typing
      interface DataItem {
        value: number;
      }
      interface Data {
        items: DataItem[];
      }

      function processData(data: Data): number[] {
        return data.items.map(item => item.value);
      }

  testingImplementation:
    name: "Testing Implementation Details"
    description: "Testing internal state or methods instead of behavior"
    bad: |
      // ❌ Testing internal state
      it('increments count state', () => {
        const { result } = renderHook(() => useCounter());
        expect(result.current.count).toBe(0);
        act(() => result.current.increment());
        expect(result.current.count).toBe(1);
      });

      // ❌ Using getByTestId unnecessarily
      expect(screen.getByTestId('user-name')).toHaveTextContent('John');
    good: |
      // ✅ Test visible behavior
      it('displays incremented count', async () => {
        render(<Counter />);
        expect(screen.getByRole('status')).toHaveTextContent('0');

        await userEvent.click(screen.getByRole('button', { name: /increment/i }));

        expect(screen.getByRole('status')).toHaveTextContent('1');
      });

      // ✅ Use accessible queries
      expect(screen.getByRole('heading', { name: 'John' })).toBeInTheDocument();

  missingKeyOrBadKey:
    name: "Missing or Non-Unique Keys"
    description: "Not providing keys or using index as key in dynamic lists"
    bad: |
      // ❌ Index as key (causes bugs with reordering)
      {items.map((item, index) => (
        <Item key={index} item={item} />
      ))}

      // ❌ No key at all
      {items.map(item => (
        <Item item={item} />
      ))}
    good: |
      // ✅ Unique identifier as key
      {items.map(item => (
        <Item key={item.id} item={item} />
      ))}

  inlineStyles:
    name: "Inline Styles"
    description: "Using inline style objects instead of CSS classes"
    bad: |
      // ❌ Inline styles
      <div style={{ padding: '16px', backgroundColor: '#f0f0f0', marginTop: '8px' }}>
        Content
      </div>
    good: |
      // ✅ Use Tailwind or CSS classes
      <div className="p-4 bg-gray-100 mt-2">
        Content
      </div>

      // ✅ Or CSS Modules
      <div className={styles.container}>
        Content
      </div>
