# ============================================================================
# CORBAT MCP - Vue Profile
# ============================================================================
# Production-ready standards for Vue 3.4+ applications.
# Covers Composition API, script setup, Pinia, and modern Vue patterns.
# Updated for Vue 3.5/3.6 best practices (2025-2026).
# ============================================================================

name: "Vue Standards"
description: "Production-ready standards for Vue 3.4+ applications with TypeScript, focusing on Composition API, script setup, Pinia, Vapor Mode readiness, and modern Vue ecosystem"

# ----------------------------------------------------------------------------
# ARCHITECTURE
# ----------------------------------------------------------------------------
architecture:
  type: "feature-based"
  enforceLayerDependencies: true
  layers:
    - name: features
      description: "Feature modules containing views, components, and composables for specific features"
      allowedDependencies:
        - shared
        - core
      packages:
        - "src/features/*"
        - "src/views/*"

    - name: shared
      description: "Reusable components, composables, and utilities used across features"
      allowedDependencies:
        - core
      packages:
        - "src/shared"
        - "src/components"
        - "src/composables"
        - "src/utils"

    - name: core
      description: "Application core: router, stores, API client, types"
      allowedDependencies: []
      packages:
        - "src/core"
        - "src/stores"
        - "src/api"
        - "src/types"

# ----------------------------------------------------------------------------
# CODE QUALITY
# ----------------------------------------------------------------------------
codeQuality:
  maxMethodLines: 30
  maxClassLines: 200
  maxFileLines: 300
  maxMethodParameters: 4
  maxCyclomaticComplexity: 10
  requireDocumentation: true
  requireTests: true
  minimumTestCoverage: 70

  principles:
    - "Composition API with script setup"
    - "Single File Components (SFC)"
    - "Composables for reusable logic"
    - "Props down, events up"
    - "Pinia for global state"
    - "TypeScript for type safety"
    - "Prefer computed over methods for derived state"

# ----------------------------------------------------------------------------
# NAMING CONVENTIONS
# ----------------------------------------------------------------------------
naming:
  general:
    component: "PascalCase (UserCard.vue)"
    composable: "useCamelCase (useUser.ts)"
    store: "useCamelCaseStore (useUserStore.ts)"
    util: "camelCase"
    constant: "SCREAMING_SNAKE_CASE"
    type: "PascalCase"
    interface: "PascalCase (no I prefix)"
    enum: "PascalCase"

  files:
    component: "PascalCase.vue"
    composable: "useName.ts"
    store: "nameStore.ts or useName.ts"
    util: "camelCase.ts"
    type: "name.types.ts or types.ts"
    test: "Name.spec.ts or Name.test.ts"

  folders:
    feature: "kebab-case"
    component: "PascalCase (component folder)"

  props:
    boolean: "is/has/should prefix (isActive, hasError)"
    handler: "onAction (onClick, onSubmit)"
    data: "descriptive noun (user, items)"

  emits:
    event: "kebab-case (update:modelValue, item-selected)"
    handler: "onEventName in parent"

# ----------------------------------------------------------------------------
# VUE 3 MODERN PATTERNS
# ----------------------------------------------------------------------------
modernPatterns:
  scriptSetup:
    required: true
    description: "Always use <script setup> for components"
    example: |
      <script setup lang="ts">
      import { ref, computed } from 'vue'
      import type { User } from '@/types'

      const props = defineProps<{
        user: User
      }>()

      const emit = defineEmits<{
        (e: 'select', id: string): void
      }>()

      const isActive = ref(false)
      </script>

  compositionAPI:
    required: true
    description: "Use Composition API, avoid Options API"
    patterns:
      - "ref() for primitive reactive values"
      - "reactive() for objects (use sparingly)"
      - "computed() for derived state"
      - "watch() / watchEffect() for side effects"
      - "Composables for reusable logic"

  defineModel:
    description: "Use defineModel for v-model binding (Vue 3.4+)"
    example: |
      <script setup lang="ts">
      const modelValue = defineModel<string>({ required: true })
      // Automatically handles :modelValue + @update:modelValue
      </script>

  propsDefaults:
    description: "Use withDefaults for props with defaults"
    example: |
      const props = withDefaults(defineProps<{
        size?: 'sm' | 'md' | 'lg'
        disabled?: boolean
      }>(), {
        size: 'md',
        disabled: false
      })

  genericComponents:
    description: "Use generic components for type-safe reusable components"
    example: |
      <script setup lang="ts" generic="T extends { id: string }">
      defineProps<{
        items: T[]
        selected?: T
      }>()

      defineEmits<{
        (e: 'select', item: T): void
      }>()
      </script>

# ----------------------------------------------------------------------------
# VAPOR MODE (Vue 3.6+)
# ----------------------------------------------------------------------------
vaporMode:
  status: "Experimental in Vue 3.6"
  description: "Vapor Mode eliminates Virtual DOM for faster rendering"
  benefits:
    - "No Virtual DOM overhead"
    - "100,000 components mounted in ~100ms"
    - "Smaller bundle size (<10KB base)"
    - "Improved memory usage with Alien Signals"
    - "Drop-in performance upgrade"

  requirements:
    - "Must use Composition API (not Options API)"
    - "Must use <script setup> syntax"
    - "Component-level opt-in"

  preparation:
    - "Ensure all components use Composition API"
    - "Migrate from Options API if needed"
    - "Avoid mixins and extends"
    - "Use modern reactivity patterns"

  rules:
    - "Write Vapor-ready code now for future compatibility"
    - "Composition API is mandatory for Vapor Mode"
    - "Test in isolated branches when experimenting"
    - "Benchmark performance improvements"

# ----------------------------------------------------------------------------
# COMPOSABLES
# ----------------------------------------------------------------------------
composables:
  description: "Extract reusable logic into composables"
  patterns:
    - "Name: useSomething"
    - "Return reactive state and methods"
    - "Handle cleanup in onUnmounted"
    - "Support SSR when needed"

  structure: |
    // composables/useUser.ts
    export function useUser(userId: Ref<string>) {
      const user = ref<User | null>(null)
      const isLoading = ref(false)
      const error = ref<Error | null>(null)

      async function fetchUser() {
        isLoading.value = true
        try {
          user.value = await api.getUser(userId.value)
        } catch (e) {
          error.value = e as Error
        } finally {
          isLoading.value = false
        }
      }

      watch(userId, fetchUser, { immediate: true })

      return {
        user: readonly(user),
        isLoading: readonly(isLoading),
        error: readonly(error),
        refetch: fetchUser
      }
    }

  rules:
    - "Prefix with 'use'"
    - "Return readonly refs when state shouldn't be modified externally"
    - "Accept refs as parameters for reactivity"
    - "Handle cleanup (removeEventListener, clearInterval)"
    - "Document parameters and return values"

# ----------------------------------------------------------------------------
# STATE MANAGEMENT
# ----------------------------------------------------------------------------
stateManagement:
  local:
    tool: "ref / reactive"
    useWhen:
      - "Component-specific state"
      - "Form state"
      - "UI state (modals, dropdowns)"

  shared:
    tool: "Pinia"
    useWhen:
      - "State shared across multiple components"
      - "Complex state logic"
      - "State that persists across routes"
      - "State that needs devtools support"

  server:
    tool: "TanStack Query (Vue Query) or VueUse useFetch"
    useWhen:
      - "API data fetching"
      - "Caching server state"
      - "Optimistic updates"
      - "Background refetching"

  piniaPatterns:
    setup: |
      // stores/userStore.ts
      export const useUserStore = defineStore('user', () => {
        // State
        const user = ref<User | null>(null)
        const isLoading = ref(false)

        // Getters (computed)
        const isLoggedIn = computed(() => !!user.value)
        const fullName = computed(() =>
          user.value ? `${user.value.firstName} ${user.value.lastName}` : ''
        )

        // Actions
        async function login(credentials: Credentials) {
          isLoading.value = true
          try {
            user.value = await authApi.login(credentials)
          } finally {
            isLoading.value = false
          }
        }

        function logout() {
          user.value = null
        }

        return {
          user: readonly(user),
          isLoading: readonly(isLoading),
          isLoggedIn,
          fullName,
          login,
          logout
        }
      })

  rules:
    - "Prefer Setup Stores over Options Stores"
    - "Use readonly() for state that shouldn't be modified directly"
    - "Colocate related state, getters, and actions"
    - "Use storeToRefs() when destructuring reactive state"

# ----------------------------------------------------------------------------
# TYPESCRIPT
# ----------------------------------------------------------------------------
technologies:
  - name: typescript
    version: "5.x"
    specificRules:
      strict: true
      noImplicitAny: true
      strictNullChecks: true
      noUnusedLocals: true
      noUnusedParameters: true

  - name: vue
    version: "3.5+"
    specificRules:
      scriptSetup: true
      compositionAPI: true
      defineModel: true
      typescript: true
      vaporModeReady: "use Composition API for future compatibility"

  - name: linting
    tools:
      - "ESLint"
      - "eslint-plugin-vue"
      - "Prettier"
      - "@vue/eslint-config-typescript"

# ----------------------------------------------------------------------------
# TESTING
# ----------------------------------------------------------------------------
testing:
  framework: "Vitest"
  assertionLibrary: "Vitest"
  componentTesting: "Vue Testing Library"

  types:
    unit:
      suffix: ".spec.ts"
      location: "co-located or __tests__/"
      coverage: 70

    component:
      suffix: ".spec.ts"
      location: "co-located"
      tool: "Vue Testing Library"
      patterns:
        - "Test user interactions"
        - "Use screen queries"
        - "Avoid testing implementation details"

    integration:
      suffix: ".integration.spec.ts"
      location: "tests/integration"

    e2e:
      tool: "Playwright or Cypress"
      location: "e2e/"

  patterns:
    arrange_act_assert: true
    behavior_testing: true
    mock_api_calls: true
    testing_library_vue: true

  example: |
    import { render, screen } from '@testing-library/vue'
    import userEvent from '@testing-library/user-event'
    import UserCard from './UserCard.vue'

    test('displays user name and handles click', async () => {
      const user = userEvent.setup()
      const onClick = vi.fn()

      render(UserCard, {
        props: { name: 'John Doe' },
        attrs: { onClick }
      })

      expect(screen.getByText('John Doe')).toBeInTheDocument()

      await user.click(screen.getByRole('button'))
      expect(onClick).toHaveBeenCalled()
    })

  rules:
    - "Prefer Vue Testing Library over @vue/test-utils directly"
    - "Test user-visible behavior"
    - "Mock Pinia stores when testing components"
    - "Use createTestingPinia() for store tests"

# ----------------------------------------------------------------------------
# STYLING
# ----------------------------------------------------------------------------
styling:
  approach: "Scoped CSS, CSS Modules, or Tailwind CSS"
  tools:
    - "Scoped CSS (default)"
    - "Tailwind CSS"
    - "CSS Modules"
    - "UnoCSS"

  rules:
    - "Use <style scoped> by default"
    - "Use :deep() for styling child components"
    - "CSS variables for theming"
    - "Mobile-first responsive design"
    - "Avoid !important"

  example: |
    <style scoped>
    .card {
      @apply p-4 rounded-lg shadow;
    }

    /* Deep selector for child components */
    :deep(.child-class) {
      color: var(--text-primary);
    }
    </style>

# ----------------------------------------------------------------------------
# PERFORMANCE
# ----------------------------------------------------------------------------
performance:
  rendering:
    - "Use v-once for static content"
    - "Use v-memo for expensive list items"
    - "Avoid v-if + v-for on same element"
    - "Use computed properties over methods in templates"
    - "Use shallowRef for large objects that don't need deep reactivity"

  lazyLoading:
    - "Lazy load routes with defineAsyncComponent"
    - "Use Suspense for async components"
    - "Dynamic imports for heavy libraries"

  lists:
    - "Always use :key with unique identifier"
    - "Use v-memo for expensive item rendering"
    - "Virtual scrolling for large lists (vue-virtual-scroller)"

  rules:
    - "Avoid reactive() for large objects (use ref)"
    - "Use shallowRef/shallowReactive when appropriate"
    - "Debounce expensive watchers"
    - "Use computed with memo"

# ----------------------------------------------------------------------------
# ROUTING
# ----------------------------------------------------------------------------
routing:
  tool: "Vue Router 4"
  patterns:
    - "Lazy load all routes"
    - "Use typed routes (vue-router auto)"
    - "Navigation guards for auth"
    - "Route-level code splitting"

  example: |
    const routes: RouteRecordRaw[] = [
      {
        path: '/users',
        component: () => import('@/views/UsersView.vue'),
        meta: { requiresAuth: true }
      }
    ]

# ----------------------------------------------------------------------------
# API INTEGRATION
# ----------------------------------------------------------------------------
api:
  client: "Axios or ofetch with TanStack Query"
  patterns:
    - "Centralize API configuration"
    - "Type all responses"
    - "Use interceptors for auth/errors"
    - "TanStack Query for caching"

  structure: |
    // api/client.ts
    export const api = ofetch.create({
      baseURL: import.meta.env.VITE_API_URL,
      onRequest({ options }) {
        const token = useAuthStore().token
        if (token) {
          options.headers.set('Authorization', `Bearer ${token}`)
        }
      }
    })

    // api/users.ts
    export const usersApi = {
      getAll: () => api<User[]>('/users'),
      getById: (id: string) => api<User>(`/users/${id}`),
      create: (data: CreateUserDto) => api<User>('/users', { method: 'POST', body: data })
    }

  tanstackQuery: |
    // composables/useUsers.ts
    export function useUsers() {
      return useQuery({
        queryKey: ['users'],
        queryFn: () => usersApi.getAll()
      })
    }

# ----------------------------------------------------------------------------
# VUEUSE
# ----------------------------------------------------------------------------
vueuse:
  description: "Use VueUse for common composables"
  recommended:
    - "useLocalStorage / useSessionStorage"
    - "useDebounceFn / useThrottleFn"
    - "useEventListener"
    - "useIntersectionObserver"
    - "useDark / useColorMode"
    - "useBreakpoints"
    - "useFetch (simple cases)"

  rules:
    - "Prefer VueUse over custom implementations"
    - "Check VueUse first before writing a composable"

# ----------------------------------------------------------------------------
# PROJECT STRUCTURE
# ----------------------------------------------------------------------------
# Recommended folder structure:
#
# src/
# ├── api/                       # API client and endpoints
# │   ├── client.ts
# │   └── users.ts
# │
# ├── assets/                    # Static assets
# │   └── images/
# │
# ├── components/                # Global/shared components
# │   ├── ui/                   # Base UI components
# │   │   ├── Button.vue
# │   │   ├── Input.vue
# │   │   └── Modal.vue
# │   └── layout/               # Layout components
# │       ├── Header.vue
# │       └── Sidebar.vue
# │
# ├── composables/               # Global composables
# │   ├── useAuth.ts
# │   └── useApi.ts
# │
# ├── features/                  # Feature modules
# │   ├── auth/
# │   │   ├── components/
# │   │   ├── composables/
# │   │   ├── views/
# │   │   │   ├── LoginView.vue
# │   │   │   └── RegisterView.vue
# │   │   └── index.ts
# │   └── dashboard/
# │
# ├── stores/                    # Pinia stores
# │   ├── auth.ts
# │   └── user.ts
# │
# ├── types/                     # TypeScript types
# │   ├── user.ts
# │   └── api.ts
# │
# ├── utils/                     # Utility functions
# │   └── format.ts
# │
# ├── views/                     # Route views (alternative to features)
# │   └── HomeView.vue
# │
# ├── App.vue
# ├── main.ts
# └── router.ts
#
# e2e/                           # E2E tests
# └── specs/

# ----------------------------------------------------------------------------
# CODE EXAMPLES
# ----------------------------------------------------------------------------
codeExamples:
  compositionAPIComponent:
    description: "Modern Vue 3 component with script setup"
    code: |
      <!-- components/UserCard.vue -->
      <script setup lang="ts">
      import { computed } from 'vue'
      import type { User } from '@/types'

      const props = defineProps<{
        user: User
        isActive?: boolean
      }>()

      const emit = defineEmits<{
        (e: 'select', userId: string): void
      }>()

      const fullName = computed(() => `${props.user.firstName} ${props.user.lastName}`)

      function handleClick() {
        emit('select', props.user.id)
      }
      </script>

      <template>
        <article
          class="user-card"
          :class="{ 'user-card--active': isActive }"
          @click="handleClick"
        >
          <img :src="user.avatar" :alt="`${fullName}'s avatar`" />
          <h3>{{ fullName }}</h3>
          <p>{{ user.email }}</p>
        </article>
      </template>

      <style scoped>
      .user-card {
        @apply p-4 rounded-lg shadow cursor-pointer transition-colors;
      }
      .user-card--active {
        @apply ring-2 ring-primary;
      }
      </style>

  defineModel:
    description: "Two-way binding with defineModel (Vue 3.4+)"
    code: |
      <!-- components/SearchInput.vue -->
      <script setup lang="ts">
      const modelValue = defineModel<string>({ required: true })
      const isFocused = ref(false)

      // Automatically handles :model-value and @update:model-value
      </script>

      <template>
        <input
          v-model="modelValue"
          type="search"
          placeholder="Search..."
          :class="{ 'ring-2': isFocused }"
          @focus="isFocused = true"
          @blur="isFocused = false"
        />
      </template>

  composable:
    description: "Reusable composable with proper patterns"
    code: |
      // composables/useUser.ts
      import { ref, readonly, watch, type Ref } from 'vue'
      import { useUserApi } from '@/api/users'
      import type { User } from '@/types'

      export function useUser(userId: Ref<string>) {
        const user = ref<User | null>(null)
        const isLoading = ref(false)
        const error = ref<Error | null>(null)

        const api = useUserApi()

        async function fetchUser() {
          if (!userId.value) return

          isLoading.value = true
          error.value = null

          try {
            user.value = await api.getById(userId.value)
          } catch (e) {
            error.value = e as Error
            user.value = null
          } finally {
            isLoading.value = false
          }
        }

        // React to userId changes
        watch(userId, fetchUser, { immediate: true })

        return {
          user: readonly(user),
          isLoading: readonly(isLoading),
          error: readonly(error),
          refetch: fetchUser
        }
      }

  piniaStore:
    description: "Pinia store with Setup Store syntax"
    code: |
      // stores/auth.ts
      import { defineStore } from 'pinia'
      import { ref, computed, readonly } from 'vue'
      import { useRouter } from 'vue-router'
      import { authApi } from '@/api/auth'
      import type { User, Credentials } from '@/types'

      export const useAuthStore = defineStore('auth', () => {
        const router = useRouter()

        // State
        const user = ref<User | null>(null)
        const token = ref<string | null>(localStorage.getItem('token'))
        const isLoading = ref(false)

        // Getters
        const isAuthenticated = computed(() => !!token.value && !!user.value)
        const displayName = computed(() =>
          user.value ? `${user.value.firstName} ${user.value.lastName}` : ''
        )

        // Actions
        async function login(credentials: Credentials) {
          isLoading.value = true
          try {
            const response = await authApi.login(credentials)
            token.value = response.token
            user.value = response.user
            localStorage.setItem('token', response.token)
            router.push('/dashboard')
          } finally {
            isLoading.value = false
          }
        }

        function logout() {
          token.value = null
          user.value = null
          localStorage.removeItem('token')
          router.push('/login')
        }

        return {
          // State (readonly for external access)
          user: readonly(user),
          token: readonly(token),
          isLoading: readonly(isLoading),
          // Getters
          isAuthenticated,
          displayName,
          // Actions
          login,
          logout
        }
      })

  genericComponent:
    description: "Generic component for type-safe reusable lists"
    code: |
      <!-- components/DataList.vue -->
      <script setup lang="ts" generic="T extends { id: string }">
      defineProps<{
        items: T[]
        selected?: T | null
      }>()

      const emit = defineEmits<{
        (e: 'select', item: T): void
        (e: 'remove', item: T): void
      }>()
      </script>

      <template>
        <ul class="data-list">
          <li
            v-for="item in items"
            :key="item.id"
            :class="{ selected: selected?.id === item.id }"
            @click="emit('select', item)"
          >
            <slot :item="item" />
            <button @click.stop="emit('remove', item)">Remove</button>
          </li>
        </ul>
      </template>

  componentTest:
    description: "Component test with Vue Testing Library"
    code: |
      // components/UserCard.spec.ts
      import { render, screen } from '@testing-library/vue'
      import userEvent from '@testing-library/user-event'
      import { describe, it, expect, vi } from 'vitest'
      import UserCard from './UserCard.vue'

      describe('UserCard', () => {
        const mockUser = {
          id: '1',
          firstName: 'John',
          lastName: 'Doe',
          email: 'john@example.com',
          avatar: '/avatar.png'
        }

        it('displays user information', () => {
          render(UserCard, {
            props: { user: mockUser }
          })

          expect(screen.getByText('John Doe')).toBeInTheDocument()
          expect(screen.getByText('john@example.com')).toBeInTheDocument()
        })

        it('emits select event when clicked', async () => {
          const user = userEvent.setup()
          const { emitted } = render(UserCard, {
            props: { user: mockUser }
          })

          await user.click(screen.getByRole('article'))

          expect(emitted()).toHaveProperty('select')
          expect(emitted().select[0]).toEqual(['1'])
        })

        it('applies active class when isActive is true', () => {
          render(UserCard, {
            props: { user: mockUser, isActive: true }
          })

          expect(screen.getByRole('article')).toHaveClass('user-card--active')
        })
      })

  tanstackQuery:
    description: "Data fetching with TanStack Query for Vue"
    code: |
      // composables/useProducts.ts
      import { useQuery, useMutation, useQueryClient } from '@tanstack/vue-query'
      import { productsApi } from '@/api/products'
      import type { Product, CreateProductDto } from '@/types'

      export function useProducts() {
        return useQuery({
          queryKey: ['products'],
          queryFn: productsApi.getAll,
          staleTime: 5 * 60 * 1000
        })
      }

      export function useProduct(id: Ref<string>) {
        return useQuery({
          queryKey: ['products', id],
          queryFn: () => productsApi.getById(id.value),
          enabled: computed(() => !!id.value)
        })
      }

      export function useCreateProduct() {
        const queryClient = useQueryClient()

        return useMutation({
          mutationFn: (data: CreateProductDto) => productsApi.create(data),
          onSuccess: () => {
            queryClient.invalidateQueries({ queryKey: ['products'] })
          }
        })
      }

# ----------------------------------------------------------------------------
# ANTI-PATTERNS
# ----------------------------------------------------------------------------
antiPatterns:
  optionsAPIInNewCode:
    name: "Using Options API in New Code"
    description: "Options API is legacy; use Composition API with script setup"
    bad: |
      // ❌ Options API
      export default {
        data() {
          return { count: 0 }
        },
        methods: {
          increment() {
            this.count++
          }
        },
        computed: {
          doubled() {
            return this.count * 2
          }
        }
      }
    good: |
      // ✅ Composition API with script setup
      <script setup lang="ts">
      const count = ref(0)
      const doubled = computed(() => count.value * 2)

      function increment() {
        count.value++
      }
      </script>

  reactiveForEverything:
    name: "Using reactive() for Everything"
    description: "reactive() has limitations; prefer ref() for most cases"
    bad: |
      // ❌ reactive has issues with reassignment and destructuring
      const state = reactive({
        user: null,
        isLoading: false
      })

      // This breaks reactivity!
      state = { user: newUser, isLoading: false }

      // This also loses reactivity
      const { user } = state
    good: |
      // ✅ Use ref() for individual values
      const user = ref<User | null>(null)
      const isLoading = ref(false)

      // Safe reassignment
      user.value = newUser

      // Or use computed for derived state
      const isLoggedIn = computed(() => !!user.value)

  mutatingProps:
    name: "Mutating Props Directly"
    description: "Props are read-only; emit events or use defineModel"
    bad: |
      // ❌ Mutating props directly
      const props = defineProps<{ items: string[] }>()

      function addItem(item: string) {
        props.items.push(item) // DON'T DO THIS
      }
    good: |
      // ✅ Emit event to parent
      const props = defineProps<{ items: string[] }>()
      const emit = defineEmits<{
        (e: 'update:items', items: string[]): void
      }>()

      function addItem(item: string) {
        emit('update:items', [...props.items, item])
      }

      // ✅ Or use defineModel for two-way binding
      const items = defineModel<string[]>('items', { required: true })

      function addItem(item: string) {
        items.value = [...items.value, item]
      }

  watchEffectOverwatch:
    name: "Using watchEffect When watch Is Better"
    description: "watchEffect runs immediately and tracks all refs; use watch for explicit dependencies"
    bad: |
      // ❌ watchEffect tracks everything used inside
      watchEffect(() => {
        if (userId.value) {
          fetchUser(userId.value) // Also tracks any refs inside fetchUser!
        }
      })
    good: |
      // ✅ Explicit dependencies with watch
      watch(userId, (newId) => {
        if (newId) {
          fetchUser(newId)
        }
      }, { immediate: true })

  vIfWithVFor:
    name: "Using v-if with v-for on Same Element"
    description: "v-if has higher priority than v-for in Vue 3, causing unexpected behavior"
    bad: |
      // ❌ v-if evaluated before v-for
      <li v-for="item in items" v-if="item.isActive" :key="item.id">
        {{ item.name }}
      </li>
    good: |
      // ✅ Filter in computed
      <script setup lang="ts">
      const activeItems = computed(() => items.value.filter(item => item.isActive))
      </script>

      <template>
        <li v-for="item in activeItems" :key="item.id">
          {{ item.name }}
        </li>
      </template>

      // ✅ Or use template wrapper
      <template v-for="item in items" :key="item.id">
        <li v-if="item.isActive">{{ item.name }}</li>
      </template>

  noKeyInVFor:
    name: "Missing :key in v-for"
    description: "Always provide a unique key for v-for items"
    bad: |
      // ❌ No key
      <li v-for="item in items">{{ item.name }}</li>

      // ❌ Index as key
      <li v-for="(item, index) in items" :key="index">{{ item.name }}</li>
    good: |
      // ✅ Unique identifier as key
      <li v-for="item in items" :key="item.id">{{ item.name }}</li>

  storeToRefsForActions:
    name: "Using storeToRefs for Actions"
    description: "storeToRefs only works for state/getters, not actions"
    bad: |
      // ❌ login is undefined (actions aren't refs)
      const { user, login } = storeToRefs(useAuthStore())
    good: |
      // ✅ Destructure actions directly
      const authStore = useAuthStore()
      const { user, isAuthenticated } = storeToRefs(authStore)
      const { login, logout } = authStore

  heavyComputedWithoutMemo:
    name: "Expensive Computed Without Caching Awareness"
    description: "Computed values are cached, but be aware of dependency tracking"
    bad: |
      // ❌ Computed recalculates on ANY items change
      const expensiveResult = computed(() =>
        items.value.map(item => heavyCalculation(item))
      )
    good: |
      // ✅ Use v-memo or shallowRef for large lists
      const items = shallowRef<Item[]>([])

      // Or memoize heavy calculations
      const memoizedCalculation = useMemoize(heavyCalculation)
      const result = computed(() =>
        items.value.map(item => memoizedCalculation(item))
      )

  directDomManipulation:
    name: "Direct DOM Manipulation"
    description: "Let Vue handle the DOM; use refs for necessary DOM access"
    bad: |
      // ❌ Direct DOM manipulation
      document.querySelector('.my-element').classList.add('active')
      document.getElementById('input').focus()
    good: |
      // ✅ Use template refs
      <script setup lang="ts">
      const inputRef = ref<HTMLInputElement | null>(null)
      const isActive = ref(false)

      function focusInput() {
        inputRef.value?.focus()
      }
      </script>

      <template>
        <input ref="inputRef" />
        <div :class="{ active: isActive }">Content</div>
      </template>
